<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Química Play: O Desafio do Vestibulando</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6; /* Blue 500 */
            --primary-dark: #2563eb; /* Blue 600 */
            --accent: #8b5cf6; /* Violet 500 */
            --success: #22c55e; /* Green 500 */
            --error: #ef4444; /* Red 500 */
            --bg-color: #f0fdfa; /* Teal 50 */
            --panel-bg: #ffffff;
            --text-main: #1e293b; /* Slate 800 */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            margin: 0;
        }

        .game-glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        /* Animações */
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        @keyframes dropIn {
            0% { transform: translateY(-30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .animate-pop { animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        .animate-drop { animation: dropIn 0.3s ease-out forwards; }

        /* Componentes Específicos */
        .option-card {
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .option-card:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }

        .beaker {
            position: relative;
            width: 120px;
            height: 140px;
            border: 4px solid #cbd5e1;
            border-top: none;
            border-radius: 0 0 20px 20px;
            margin: 0 auto;
            background: rgba(255,255,255,0.5);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            overflow: hidden;
        }

        .beaker::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            height: 10px;
            border: 4px solid #cbd5e1;
            border-radius: 10px;
            background: white;
        }

        .beaker.target-active {
            border-color: var(--primary);
            background: #eff6ff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        .liquid {
            width: 100%;
            height: 0%;
            background: #3b82f6;
            transition: height 0.5s ease-in-out, background-color 0.3s ease;
        }

        .beaker.success .liquid { background: var(--success); height: 70%; }
        .beaker.error .liquid { background: var(--error); height: 40%; }

        .reagent {
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .reagent.selected {
            border-color: var(--primary);
            background-color: #eff6ff;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        /* Esconder scrollbar na área de itens ordenáveis se ficar muito grande */
        .sortable-list::-webkit-scrollbar { width: 6px; }
        .sortable-list::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800">

    <main id="game-app" class="game-glass w-full max-w-4xl rounded-2xl overflow-hidden flex flex-col min-h-[600px] animate-pop">
        
        <!-- Cabeçalho / HUD -->
        <header class="bg-white px-6 py-4 border-b border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4 z-10">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white font-bold text-xl w-10 h-10 rounded-full flex items-center justify-center shadow-md">
                    <span id="hud-level">1</span>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Química em Jogo</h1>
                    <span id="hud-topic" class="text-xs font-semibold uppercase tracking-wider text-blue-600 bg-blue-100 px-2 py-1 rounded-md">Tema</span>
                </div>
            </div>
            
            <div class="flex items-center gap-4 w-full md:w-auto">
                <div class="flex-grow md:flex-grow-0 md:w-48 bg-slate-100 h-3 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-violet-500 h-full w-0 transition-all duration-500"></div>
                </div>
                <div class="font-bold text-slate-500 text-sm whitespace-nowrap">
                    Pontos: <span id="hud-score" class="text-blue-600 text-lg">0</span>
                </div>
            </div>
        </header>

        <!-- Área Central (Questão e Interação) -->
        <section class="p-6 md:p-8 flex-grow flex flex-col relative">
            <h2 id="question-text" class="text-xl md:text-2xl font-bold mb-6 text-center leading-snug">
                Carregando o desafio...
            </h2>

            <!-- NOVO: Caixa de Dica (Oculta por padrão) -->
            <div id="hint-box" class="hidden bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6 rounded-r-lg shadow-sm w-full max-w-2xl mx-auto animate-drop">
                <div class="flex items-center gap-2">
                    <span class="text-xl">💡</span>
                    <span class="font-bold text-yellow-800 uppercase text-sm tracking-wider">Dica do Professor</span>
                </div>
                <p id="hint-text" class="text-yellow-900 mt-2 font-medium"></p>
            </div>

            <div id="interaction-area" class="flex-grow flex flex-col justify-center items-center w-full relative min-h-[250px]">
                <!-- Conteúdo injetado via JS -->
            </div>

            <!-- Overlay de Feedback -->
            <div id="feedback-panel" class="hidden absolute inset-0 bg-white/90 backdrop-blur-sm z-20 flex-col items-center justify-center p-8 text-center animate-pop">
                <div id="feedback-icon" class="text-6xl mb-4">✅</div>
                <h3 id="feedback-title" class="text-2xl font-bold mb-2">Muito Bem!</h3>
                <p id="feedback-message" class="text-lg text-slate-600 mb-6 max-w-lg">Explicação da resposta.</p>
                <button id="next-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-transform transform hover:scale-105 active:scale-95 text-lg">
                    Próxima Questão ➔
                </button>
            </div>
        </section>

    </main>

    <script>
        // ==========================================
        // BANCO DE QUESTÕES (28 Fases Estruturadas)
        // ==========================================
        const questoes = [
            // --- TEMA 1: DILUIÇÃO E MISTURAS (1 a 9) ---
            {
                tipo: 'transfer',
                tema: 'Diluição de Soluções',
                pergunta: 'Temos 200 mL de uma solução de NaOH a 0,5 mol/L. Queremos diluí-la para 0,1 mol/L. Qual volume de água deve ser ADICIONADO ao béquer?',
                opcoes: [
                    { id: 'q1_a', texto: '1000 mL' },
                    { id: 'q1_b', texto: '800 mL' },
                    { id: 'q1_c', texto: '200 mL' }
                ],
                correta: 'q1_b',
                explicacao: 'Pela fórmula C1.V1 = C2.V2 (0,5 * 200 = 0,1 * V2), o volume final é 1000mL. Como já tínhamos 200mL, adicionamos 800mL de água.',
                dica: 'Lembre-se da fórmula C1.V1 = C2.V2. Cuidado: a fórmula dá o volume FINAL, mas a pergunta pede o volume ADICIONADO!'
            },
            {
                tipo: 'select',
                tema: 'Diluição de Soluções',
                pergunta: 'Durante o processo de diluição de uma solução aquosa, qual das grandezas abaixo PERMANECE CONSTANTE?',
                opcoes: [
                    { id: 'q2_a', texto: 'O volume da solução' },
                    { id: 'q2_b', texto: 'A concentração em mol/L' },
                    { id: 'q2_c', texto: 'A quantidade (massa/mols) de soluto' },
                    { id: 'q2_d', texto: 'A densidade da solução' }
                ],
                correta: 'q2_c',
                explicacao: 'Na diluição, apenas adicionamos solvente (água). A quantidade de soluto não se altera, por isso C1.V1 = C2.V2.',
                dica: 'Na diluição, nós apenas acrescentamos água (solvente). Pense no que acontece com o material que já estava dissolvido.'
            },
            {
                tipo: 'sort',
                tema: 'Diluição de Soluções',
                pergunta: 'Ordene as soluções abaixo da MAIS CONCENTRADA (topo) para a MAIS DILUÍDA (base).',
                opcoes: [
                    { id: 's1', texto: '0,1 mol/L' },
                    { id: 's2', texto: '2,0 mol/L' },
                    { id: 's3', texto: '0,5 mol/L' },
                    { id: 's4', texto: '1,0 mol/L' }
                ],
                ordemCorreta: ['s2', 's4', 's3', 's1'],
                explicacao: 'A concentração molar indica a quantidade de mols por litro. Quanto maior o valor, mais concentrada é a solução.',
                dica: 'A concentração (mol/L) indica a força da solução. Números maiores significam soluções mais fortes (concentradas).'
            },
            {
                tipo: 'transfer',
                tema: 'Mistura de Soluções',
                pergunta: 'Misturamos 100 mL de HCl 2 mol/L com 100 mL de HCl 4 mol/L. Qual a concentração final a ser obtida no béquer?',
                opcoes: [
                    { id: 'q4_a', texto: '6 mol/L' },
                    { id: 'q4_b', texto: '3 mol/L' },
                    { id: 'q4_c', texto: '1,5 mol/L' }
                ],
                correta: 'q4_b',
                explicacao: 'Fórmula: C_final = (C1.V1 + C2.V2) / (V1 + V2). Fica (200 + 400) / 200 = 600 / 200 = 3 mol/L.',
                dica: 'Como os volumes são iguais (100mL e 100mL), a concentração final será exatamente a média aritmética das duas soluções iniciais.'
            },
            {
                tipo: 'select',
                tema: 'Concentração de Soluções',
                pergunta: 'Se evaporarmos exatamente 50% da água de uma solução aquosa de sal a 0,2 mol/L, qual será a nova concentração?',
                opcoes: [
                    { id: 'q5_a', texto: '0,1 mol/L' },
                    { id: 'q5_b', texto: '0,2 mol/L' },
                    { id: 'q5_c', texto: '0,4 mol/L' }
                ],
                correta: 'q5_c',
                explicacao: 'Ao reduzir o volume pela metade (evaporação) sem alterar o soluto, a concentração dobra (inversamente proporcionais).',
                dica: 'Se a água evapora, o volume diminui. Menos água com a mesma quantidade de sal deixa a solução mais forte.'
            },
            {
                tipo: 'sort',
                tema: 'Técnica de Laboratório',
                pergunta: 'Ordene os passos lógicos para preparar uma diluição a partir de uma "Solução Estoque" no laboratório:',
                opcoes: [
                    { id: 'p1', texto: 'Calcular o volume necessário da solução estoque' },
                    { id: 'p2', texto: 'Completar o volume com água destilada até a marca' },
                    { id: 'p3', texto: 'Pipetar o volume calculado da solução estoque' },
                    { id: 'p4', texto: 'Transferir para um balão volumétrico limpo' }
                ],
                ordemCorreta: ['p1', 'p3', 'p4', 'p2'],
                explicacao: 'Primeiro calcula-se (C1V1=C2V2), depois retira-se o volume com uma pipeta, transfere-se para o balão e completa-se com solvente.',
                dica: 'Você precisa saber o quanto pegar antes de agir. E o último passo é sempre adicionar a água destilada para completar.'
            },
            {
                tipo: 'transfer',
                tema: 'Diluição de Soluções',
                pergunta: 'Precisamos preparar 1 Litro de solução 0,1 mol/L. Temos um estoque a 1,0 mol/L. Quanto da solução estoque devo transferir?',
                opcoes: [
                    { id: 'q7_a', texto: '10 mL' },
                    { id: 'q7_b', texto: '100 mL' },
                    { id: 'q7_c', texto: '900 mL' }
                ],
                correta: 'q7_b',
                explicacao: '1,0 * V1 = 0,1 * 1000mL -> V1 = 100 mL da solução estoque. Os outros 900mL serão de água.',
                dica: 'Aplique a fórmula da diluição: C_estoque * V_estoque = C_final * V_final. Lembre-se que 1 Litro = 1000 mL.'
            },
            {
                tipo: 'select',
                tema: 'Titulação',
                pergunta: 'A técnica laboratorial usada para descobrir a concentração de uma solução reagindo-a com outra de concentração conhecida chama-se:',
                opcoes: [
                    { id: 'q8_a', texto: 'Destilação Fracionada' },
                    { id: 'q8_b', texto: 'Titulação (Volumetria)' },
                    { id: 'q8_c', texto: 'Cromatografia' }
                ],
                correta: 'q8_b',
                explicacao: 'A Titulação é uma aplicação de mistura de solutos que reagem entre si, onde o ponto de viragem indica equivalência de mols.',
                dica: 'Essa técnica usa uma bureta (que goteja) e um erlenmeyer. Começa com a letra T.'
            },
            {
                tipo: 'transfer',
                tema: 'Diluição em Massa',
                pergunta: 'Uma solução tem 50 g/L de concentração. Ela sofre uma diluição de proporção 1:10. Qual a concentração da solução final a ser gerada?',
                opcoes: [
                    { id: 'q9_a', texto: '500 g/L' },
                    { id: 'q9_b', texto: '5 g/L' },
                    { id: 'q9_c', texto: '0,5 g/L' }
                ],
                correta: 'q9_b',
                explicacao: 'Diluir 1:10 significa que o volume final será 10 vezes maior. Logo, a concentração será 10 vezes menor (50 / 10 = 5 g/L).',
                dica: 'Diluir 1:10 significa adicionar tanta água que o volume total fica 10 vezes maior. O que acontece com a força (concentração)?'
            },
            
            // --- TEMA 2: VAPORIZAÇÃO E PRESSÃO DE VAPOR (10 a 18) ---
            {
                tipo: 'select',
                tema: 'Pressão de Vapor',
                pergunta: 'A 25°C, qual dos líquidos abaixo apresenta a MAIOR pressão de vapor, sendo classificado como o mais volátil?',
                opcoes: [
                    { id: 'q10_a', texto: 'Água (H₂O)' },
                    { id: 'q10_b', texto: 'Etanol (C₂H₆O)' },
                    { id: 'q10_c', texto: 'Éter Dietílico (C₄H₁₀O)' }
                ],
                correta: 'q10_c',
                explicacao: 'O Éter possui ligações dipolo-dipolo fracas (não faz ponte de hidrogênio), o que facilita sua evaporação, gerando alta pressão de vapor.',
                dica: 'O líquido mais volátil (maior pressão de vapor) é aquele que evapora mais rápido por ter as ligações intermoleculares mais fracas.'
            },
            {
                tipo: 'sort',
                tema: 'Volatilidade',
                pergunta: 'Ordene os compostos abaixo em ordem DECRESCENTE de volatilidade (do que evapora mais fácil no topo, para o que evapora menos na base).',
                opcoes: [
                    { id: 'v1', texto: 'Água (T.E. = 100°C)' },
                    { id: 'v2', texto: 'Éter comum (T.E. = 34°C)' },
                    { id: 'v3', texto: 'Álcool Etílico (T.E. = 78°C)' }
                ],
                ordemCorreta: ['v2', 'v3', 'v1'],
                explicacao: 'Quanto menor a Temperatura de Ebulição (T.E.), mais volátil é o líquido e mais rápido ele evapora em temperatura ambiente.',
                dica: 'Temperatura de Ebulição (T.E.) baixa significa que o líquido ferve (e evapora) muito mais rápido do que os outros.'
            },
            {
                tipo: 'transfer',
                tema: 'Ebulição',
                pergunta: 'Um líquido entra no estado de ebulição (ferve) no exato momento em que sua Pressão de Vapor se iguala à...',
                opcoes: [
                    { id: 'q12_a', texto: 'Pressão Osmótica' },
                    { id: 'q12_b', texto: 'Pressão Atmosférica Externa' },
                    { id: 'q12_c', texto: 'Pressão Parcial do Oxigênio' }
                ],
                correta: 'q12_b',
                explicacao: 'A ebulição ocorre quando as bolhas de vapor dentro do líquido conseguem vencer a pressão atmosférica que "esmaga" a superfície.',
                dica: 'Para que as bolhas de vapor escapem do líquido, elas precisam vencer a força do ar que as empurra para baixo.'
            },
            {
                tipo: 'select',
                tema: 'Física do Cotidiano',
                pergunta: 'Em uma panela de pressão, os alimentos cozinham mais rápido porque:',
                opcoes: [
                    { id: 'q13_a', texto: 'A água ferve a uma temperatura menor que 100°C.' },
                    { id: 'q13_b', texto: 'A alta pressão interna faz a água ferver a UMA TEMPERATURA MAIOR que 100°C.' },
                    { id: 'q13_c', texto: 'A pressão quebra as moléculas de água, liberando calor.' }
                ],
                correta: 'q13_b',
                explicacao: 'O vapor preso aumenta a pressão sobre o líquido, dificultando a ebulição. A água precisa chegar a ~120°C para ferver, cozinhando o alimento mais rápido.',
                dica: 'Se a pressão em cima da água for muito forte, ela precisará esquentar muito mais do que os normais 100°C para conseguir ferver.'
            },
            {
                tipo: 'sort',
                tema: 'Altitude e Ebulição',
                pergunta: 'Ordene os locais do MENOR tempo para cozinhar um ovo (água ferve mais quente, base) para o MAIOR tempo (água ferve mais fria, topo).',
                opcoes: [
                    { id: 'a1', texto: 'La Paz - Bolívia (Altitude: 3.640m)' },
                    { id: 'a2', texto: 'São Paulo - Brasil (Altitude: 760m)' },
                    { id: 'a3', texto: 'Santos - Litoral (Altitude: 0m - Nível do mar)' }
                ],
                ordemCorreta: ['a1', 'a2', 'a3'],
                explicacao: 'Em La Paz a pressão atmosférica é menor, a água ferve a ~87°C (demora muito para cozinhar). Em Santos ferve a 100°C (cozinha mais rápido).',
                dica: 'Em locais altos (La Paz), há menos ar (menor pressão), então a água ferve cedo (a 85°C). Água menos quente demora muito mais para cozinhar.'
            },
            {
                tipo: 'transfer',
                tema: 'Pressão de Vapor',
                pergunta: 'Selecione e transfira o ÚNICO fator que NÃO altera a pressão de vapor de um líquido puro em um recipiente fechado.',
                opcoes: [
                    { id: 'q15_a', texto: 'A Temperatura do sistema' },
                    { id: 'q15_b', texto: 'A Natureza do líquido (forças intermoleculares)' },
                    { id: 'q15_c', texto: 'O Volume do líquido no recipiente' }
                ],
                correta: 'q15_c',
                explicacao: 'A pressão de vapor independe da quantidade/volume do líquido, dependendo exclusivamente da temperatura e do tipo de líquido (sua natureza).',
                dica: 'Ter 1 copo de água ou uma piscina inteira de água (na mesma temperatura) não faz diferença para a pressão de vapor.'
            },
            {
                tipo: 'select',
                tema: 'Forças Intermoleculares',
                pergunta: 'Qual a relação correta entre as Forças Intermoleculares e a Pressão de Vapor?',
                opcoes: [
                    { id: 'q16_a', texto: 'Quanto MAIS FORTES as forças, MAIOR a pressão de vapor.' },
                    { id: 'q16_b', texto: 'Quanto MAIS FORTES as forças, MENOR a pressão de vapor.' },
                    { id: 'q16_c', texto: 'Forças intermoleculares não afetam a pressão de vapor.' }
                ],
                correta: 'q16_b',
                explicacao: 'Se as moléculas estão fortemente unidas (ex: Pontes de Hidrogênio), é difícil para elas escaparem para a fase gasosa, gerando baixa pressão de vapor.',
                dica: 'Se as moléculas estão muito "agarradas" umas às outras (forças fortes), fica muito difícil para elas desgrudarem e escaparem para virar vapor.'
            },
            {
                tipo: 'select',
                tema: 'Tonoscopia',
                pergunta: 'O que acontece com a Pressão de Vapor da água pura quando adicionamos um soluto NÃO VOLÁTIL (como sal de cozinha)?',
                opcoes: [
                    { id: 'q17_a', texto: 'Aumenta significativamente' },
                    { id: 'q17_b', texto: 'Permanece inalterada' },
                    { id: 'q17_c', texto: 'Diminui (abaixamento tonoscópico)' }
                ],
                correta: 'q17_c',
                explicacao: 'O efeito Tonoscópico explica que partículas de soluto na superfície dificultam o escape das moléculas do solvente, diminuindo a pressão de vapor.',
                dica: 'As partículas do soluto não volátil "atrapalham" fisicamente as moléculas de água, impedindo-as de evaporar com facilidade.'
            },
            {
                tipo: 'sort',
                tema: 'Gráficos de Pressão',
                pergunta: 'Em um gráfico de Pressão de Vapor (Eixo Y) vs Temperatura (Eixo X), ordene as curvas imaginárias da MAIS À ESQUERDA (topo) para a MAIS À DIREITA (base).',
                opcoes: [
                    { id: 'g1', texto: 'Líquido com ligações fortíssimas (T.E. Alta)' },
                    { id: 'g2', texto: 'Líquido extremamente volátil (T.E. Baixa)' },
                    { id: 'g3', texto: 'Líquido de volatilidade intermediária' }
                ],
                ordemCorreta: ['g2', 'g3', 'g1'],
                explicacao: 'A curva mais à esquerda atinge 1 ATM (ebulição) em temperaturas mais baixas, ou seja, é o líquido mais volátil.',
                dica: 'A curva mais à esquerda é a daquele líquido que chega rápido na pressão de ferver, precisando de pouca temperatura (muito volátil).'
            },

            // --- TEMA 3: PROPRIEDADES COLIGATIVAS (19 a 28) ---
            {
                tipo: 'select',
                tema: 'Introdução Coligativas',
                pergunta: 'Propriedades Coligativas são propriedades do solvente que sofrem alteração mediante adição de um soluto não volátil. Elas dependem exclusivamente de:',
                opcoes: [
                    { id: 'q19_a', texto: 'Do tamanho das partículas do soluto' },
                    { id: 'q19_b', texto: 'Da natureza química do soluto (se é ácido, base...)' },
                    { id: 'q19_c', texto: 'Do NÚMERO de partículas do soluto dispersas' }
                ],
                correta: 'q19_c',
                explicacao: 'Coligativa vem de "coleção". O que importa é a QUANTIDADE de partículas geradas na solução, não de que material elas são feitas.',
                dica: 'A palavra coligativa lembra "coleção" ou "coletivo". Os efeitos ignoram DE QUÊ o material é feito, só ligam para a QUANTIDADE de peças geradas.'
            },
            {
                tipo: 'transfer',
                tema: 'Crioscopia',
                pergunta: 'Em países frios, joga-se sal nas estradas com neve para derreter o gelo. Envie para o béquer o nome dessa propriedade coligativa.',
                opcoes: [
                    { id: 'q20_a', texto: 'Ebulioscopia' },
                    { id: 'q20_b', texto: 'Tonoscopia' },
                    { id: 'q20_c', texto: 'Crioscopia' }
                ],
                correta: 'q20_c',
                explicacao: 'A Crioscopia estuda o ABAIXAMENTO do ponto de congelamento do solvente. Com sal, a água passa a congelar em temperaturas negativas (ex: -5°C).',
                dica: 'Ebulioscopia refere-se a ferver, Tonoscopia à pressão de vapor. O prefixo "Crio-" refere-se ao frio e ao congelamento.'
            },
            {
                tipo: 'sort',
                tema: 'Ebulioscopia',
                pergunta: 'Ordene as soluções aquosas a 1,0 mol/L da MENOR temperatura de ebulição (topo) para a MAIOR (base). Lembre-se da dissociação!',
                opcoes: [
                    { id: 'e1', texto: 'NaCl (Gera 2 partículas: Na+, Cl-)' },
                    { id: 'e2', texto: 'Glicose (Não se dissocia, i=1)' },
                    { id: 'e3', texto: 'CaCl₂ (Gera 3 partículas: Ca²⁺, 2 Cl⁻)' }
                ],
                ordemCorreta: ['e2', 'e1', 'e3'],
                explicacao: 'Quanto mais partículas (Fator de Van\'t Hoff), maior o aumento da temperatura de ebulição (Efeito Ebulioscópico).',
                dica: 'A lógica é: Quanto MAIS partículas dissolvidas, MAIS DIFÍCIL fica para a água ferver (maior é a temperatura que ela precisará atingir).'
            },
            {
                tipo: 'select',
                tema: 'Fator de Van\'t Hoff (i)',
                pergunta: 'Qual é o Fator de Van\'t Hoff (i) para o sal Sulfato de Alumínio - Al₂(SO₄)₃, considerando 100% de dissociação?',
                opcoes: [
                    { id: 'q22_a', texto: 'i = 3' },
                    { id: 'q22_b', texto: 'i = 5' },
                    { id: 'q22_c', texto: 'i = 6' }
                ],
                correta: 'q22_b',
                explicacao: 'Al₂(SO₄)₃ se dissocia em 2 cátions Al³⁺ e 3 ânions SO₄²⁻. Total de 2 + 3 = 5 partículas.',
                dica: 'Para descobrir as partículas separadas, some os numerozinhos da molécula: 2 (do Alumínio) mais 3 (do bloco de Sulfato SO4).'
            },
            {
                tipo: 'sort',
                tema: 'Efeito Crioscópico Máximo',
                pergunta: 'Ordene as soluções (todas 0,1 mol/L) do MENOR ponto de congelamento (mais frio, base) para o MAIOR (próximo a 0°C, topo).',
                opcoes: [
                    { id: 'c1', texto: 'Solução de Al₂(SO₄)₃ (i=5)' },
                    { id: 'c2', texto: 'Solução de Glicose (i=1)' },
                    { id: 'c3', texto: 'Solução de NaCl (i=2)' },
                    { id: 'c4', texto: 'Solução de CaCl₂ (i=3)' }
                ],
                ordemCorreta: ['c2', 'c3', 'c4', 'c1'], // O que abaixa mais fica na base.
                explicacao: 'Al₂(SO₄)₃ gera mais partículas (5), provocando o maior abaixamento crioscópico (ex: -3°C). A glicose gera menos, ficando mais perto do 0°C.',
                dica: 'A solução com o maior número de partículas (maior "i") é aquela que fará a água congelar na temperatura mais absurdamente fria (negativa).'
            },
            {
                tipo: 'transfer',
                tema: 'Osmose',
                pergunta: 'As carnes-secas e o bacalhau são conservados com muito sal. Esse meio suga a água das bactérias, matando-as por desidratação. O nome desse processo é...',
                opcoes: [
                    { id: 'q24_a', texto: 'Evaporação' },
                    { id: 'q24_b', texto: 'Osmose' },
                    { id: 'q24_c', texto: 'Diálise' }
                ],
                correta: 'q24_b',
                explicacao: 'A Osmose é a passagem de SOLVENTE (água) do meio menos concentrado (dentro da bactéria) para o mais concentrado (sal fora dela).',
                dica: 'Na biologia e na química, o movimento de água através das membranas das células (para tentar diluir o meio mais salgado) recebe o mesmo nome.'
            },
            {
                tipo: 'select',
                tema: 'Pressão Osmótica',
                pergunta: 'Uma membrana semipermeável, essencial para os processos de osmose, tem a característica de:',
                opcoes: [
                    { id: 'q25_a', texto: 'Permitir a passagem APENAS do soluto.' },
                    { id: 'q25_b', texto: 'Permitir a passagem APENAS do solvente.' },
                    { id: 'q25_c', texto: 'Bloquear qualquer tipo de passagem molecular.' }
                ],
                correta: 'q25_b',
                explicacao: 'Como os "furos" da membrana são minúsculos, apenas moléculas pequenas do solvente (água) passam. Íons e moléculas grandes de soluto ficam retidos.',
                dica: 'Osmose é o movimento exclusivo da ÁGUA. O soluto (sal/açúcar) costuma ser grande demais para passar pelos microporos da membrana.'
            },
            {
                tipo: 'transfer',
                tema: 'Fluxo Osmótico',
                pergunta: 'A Solução A tem concentração 0,1 mol/L. A Solução B tem concentração 0,5 mol/L. Ambas são separadas por membrana. Qual o fluxo da água?',
                opcoes: [
                    { id: 'q26_a', texto: 'De A para B (Hipotônico p/ Hipertônico)' },
                    { id: 'q26_b', texto: 'De B para A (Hipertônico p/ Hipotônico)' },
                    { id: 'q26_c', texto: 'Não há fluxo de água' }
                ],
                correta: 'q26_a',
                explicacao: 'A água sempre tenta "diluir" o lado mais forte. Por isso ela sai do meio Hipotônico (A, mais ralo) e vai para o Hipertônico (B, mais concentrado).',
                dica: 'A água natural sempre atua como um "bombeiro", viajando para tentar diluir (apagar) o lado que está mais forte/salgado (Hipertônico).'
            },
            {
                tipo: 'select',
                tema: 'Osmose Reversa',
                pergunta: 'Qual das alternativas abaixo representa a principal aplicação tecnológica e industrial da OSMOSE REVERSA no mundo hoje?',
                opcoes: [
                    { id: 'q27_a', texto: 'Fabricação de bebidas alcoólicas' },
                    { id: 'q27_b', texto: 'Dessalinização da água do mar' },
                    { id: 'q27_c', texto: 'Congelamento de carnes em frigoríficos' }
                ],
                correta: 'q27_b',
                explicacao: 'Aplicando alta pressão sobre a água salgada, forçamos o solvente a fazer o caminho inverso, passando pela membrana e purificando a água.',
                dica: 'É o processo utilizado por submarinos e em Israel para transformar água imprópria do oceano em água potável.'
            },
            {
                tipo: 'sort',
                tema: 'Cálculo de Pressão Osmótica',
                pergunta: 'A Pressão Osmótica (π = M.R.T.i) é maior quanto maior o número de partículas. Ordene da MENOR pressão (topo) para a MAIOR pressão osmótica (base).',
                opcoes: [
                    { id: 'o1', texto: 'Ureia 0,1 mol/L (i=1)' },
                    { id: 'o2', texto: 'Fe₂(SO₄)₃ 0,1 mol/L (i=5)' },
                    { id: 'o3', texto: 'MgCl₂ 0,1 mol/L (i=3)' }
                ],
                ordemCorreta: ['o1', 'o3', 'o2'],
                explicacao: 'A pressão osmótica é diretamente proporcional ao número de partículas do soluto dispersas na solução.',
                dica: 'O Fator (i) indica quantas partículas são geradas. Menos partículas soltas = Menor pressão osmótica.'
            }
        ];

        // ==========================================
        // LÓGICA E ESTADO DO JOGO
        // ==========================================
        let currentLevel = 0;
        let score = 0;
        let selectedTransferId = null;
        let currentAttempt = 1; // Variável para controlar as tentativas

        // Referências DOM
        const els = {
            level: document.getElementById('hud-level'),
            topic: document.getElementById('hud-topic'),
            score: document.getElementById('hud-score'),
            progress: document.getElementById('progress-bar'),
            question: document.getElementById('question-text'),
            area: document.getElementById('interaction-area'),
            hintBox: document.getElementById('hint-box'),
            hintText: document.getElementById('hint-text'),
            feedback: document.getElementById('feedback-panel'),
            fTitle: document.getElementById('feedback-title'),
            fMsg: document.getElementById('feedback-message'),
            fIcon: document.getElementById('feedback-icon'),
            nextBtn: document.getElementById('next-btn')
        };

        function initGame() {
            renderQuestion();
        }

        function renderQuestion() {
            if (currentLevel >= questoes.length) {
                showEndScreen();
                return;
            }

            const q = questoes[currentLevel];
            els.level.textContent = currentLevel + 1;
            els.topic.textContent = q.tema;
            els.question.textContent = q.pergunta;
            els.progress.style.width = `${((currentLevel) / questoes.length) * 100}%`;
            els.feedback.classList.add('hidden');
            els.area.innerHTML = '';
            els.area.classList.remove('animate-pop');
            void els.area.offsetWidth; // trigger reflow
            els.area.classList.add('animate-pop');
            selectedTransferId = null;

            // Mostra ou esconde a dica baseando-se na tentativa
            if (currentAttempt > 1) {
                els.hintBox.classList.remove('hidden');
                els.hintText.textContent = q.dica;
            } else {
                els.hintBox.classList.add('hidden');
            }

            if (q.tipo === 'select') renderSelect(q);
            else if (q.tipo === 'transfer') renderTransfer(q);
            else if (q.tipo === 'sort') renderSort(q);
        }

        function renderSelect(q) {
            const grid = document.createElement('div');
            grid.className = 'w-full max-w-2xl grid grid-cols-1 gap-4';

            q.opcoes.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-card bg-white border-2 border-slate-200 text-slate-700 font-semibold p-4 rounded-xl text-left text-lg flex items-center gap-3 w-full';
                btn.innerHTML = `<div class="w-6 h-6 rounded-full border-2 border-slate-300 flex-shrink-0"></div> <span>${opt.texto}</span>`;
                
                btn.onclick = () => {
                    document.querySelectorAll('.option-card').forEach(b => b.disabled = true);
                    const isCorrect = opt.id === q.correta;
                    
                    if (isCorrect) {
                        btn.classList.add('border-green-500', 'bg-green-50');
                        btn.querySelector('div').classList.add('bg-green-500', 'border-green-500');
                    } else {
                        btn.classList.add('border-red-500', 'bg-red-50');
                        btn.classList.add('animate-shake');
                        btn.querySelector('div').classList.add('bg-red-500', 'border-red-500');
                    }
                    
                    setTimeout(() => handleAnswer(isCorrect, q.explicacao), 800);
                };
                grid.appendChild(btn);
            });
            els.area.appendChild(grid);
        }

        function renderTransfer(q) {
            const container = document.createElement('div');
            container.className = 'w-full max-w-3xl flex flex-col md:flex-row justify-around items-center gap-8';

            // Lado Esquerdo: Reagentes (Opções)
            const reagentsBox = document.createElement('div');
            reagentsBox.className = 'flex flex-col gap-3 w-full md:w-1/2';
            
            // Lado Direito: Alvo (Béquer)
            const targetBox = document.createElement('div');
            targetBox.className = 'flex flex-col items-center justify-center w-full md:w-1/3 mt-6 md:mt-0';
            
            const beaker = document.createElement('div');
            beaker.className = 'beaker';
            beaker.innerHTML = '<div class="liquid"></div>';
            
            const beakerLabel = document.createElement('div');
            beakerLabel.className = 'mt-4 font-bold text-slate-500 text-center uppercase tracking-wide text-sm';
            beakerLabel.textContent = 'Clique para Transferir';

            targetBox.appendChild(beaker);
            targetBox.appendChild(beakerLabel);

            // Lógica de Seleção
            q.opcoes.forEach(opt => {
                const item = document.createElement('div');
                item.className = 'reagent bg-white shadow-md rounded-lg p-4 font-bold text-center border-2 border-slate-200 select-none';
                item.innerHTML = `🧪 ${opt.texto}`;
                
                item.onclick = () => {
                    document.querySelectorAll('.reagent').forEach(r => r.classList.remove('selected'));
                    item.classList.add('selected');
                    selectedTransferId = opt.id;
                    beaker.classList.add('target-active');
                    beakerLabel.textContent = 'Clique no béquer para despejar';
                    beakerLabel.classList.add('text-blue-600', 'animate-pulse');
                };
                reagentsBox.appendChild(item);
            });

            // Lógica de Despejo (Dropping)
            beaker.onclick = () => {
                if (!selectedTransferId) return;
                
                beakerLabel.classList.remove('animate-pulse');
                const isCorrect = selectedTransferId === q.correta;
                
                if (isCorrect) {
                    beaker.classList.add('success');
                    beakerLabel.textContent = 'Transferência Correta!';
                    beakerLabel.classList.replace('text-blue-600', 'text-green-600');
                } else {
                    beaker.classList.add('error');
                    beaker.classList.add('animate-shake');
                    beakerLabel.textContent = 'Erro!';
                    beakerLabel.classList.replace('text-blue-600', 'text-red-600');
                }

                // Desabilita interações
                beaker.style.pointerEvents = 'none';
                reagentsBox.style.pointerEvents = 'none';
                
                setTimeout(() => handleAnswer(isCorrect, q.explicacao), 1200);
            };

            container.appendChild(reagentsBox);
            container.appendChild(targetBox);
            els.area.appendChild(container);
        }

        function renderSort(q) {
            const container = document.createElement('div');
            container.className = 'w-full max-w-2xl flex flex-col gap-2 sortable-list';

            // Cria cópia manipulável e embaralha levemente
            let items = [...q.opcoes].sort(() => Math.random() - 0.5);

            const renderList = () => {
                container.innerHTML = '';
                items.forEach((opt, index) => {
                    const row = document.createElement('div');
                    row.className = 'bg-white border border-slate-200 p-3 rounded-lg flex items-center justify-between shadow-sm animate-drop';
                    
                    const textSpan = document.createElement('span');
                    textSpan.className = 'font-semibold text-slate-700';
                    textSpan.textContent = `${index + 1}. ${opt.texto}`;

                    const controls = document.createElement('div');
                    controls.className = 'flex gap-1';

                    const btnUp = document.createElement('button');
                    btnUp.innerHTML = '⬆️';
                    btnUp.className = 'p-2 bg-slate-100 hover:bg-slate-200 rounded disabled:opacity-30';
                    btnUp.disabled = index === 0;
                    btnUp.onclick = () => moveItem(index, -1);

                    const btnDown = document.createElement('button');
                    btnDown.innerHTML = '⬇️';
                    btnDown.className = 'p-2 bg-slate-100 hover:bg-slate-200 rounded disabled:opacity-30';
                    btnDown.disabled = index === items.length - 1;
                    btnDown.onclick = () => moveItem(index, 1);

                    controls.appendChild(btnUp);
                    controls.appendChild(btnDown);
                    row.appendChild(textSpan);
                    row.appendChild(controls);
                    container.appendChild(row);
                });
            };

            const moveItem = (index, dir) => {
                const temp = items[index];
                items[index] = items[index + dir];
                items[index + dir] = temp;
                renderList();
            };

            renderList();
            els.area.appendChild(container);

            const checkBtn = document.createElement('button');
            checkBtn.className = 'mt-6 bg-violet-600 hover:bg-violet-700 text-white font-bold py-3 px-8 rounded-xl shadow-md w-full max-w-xs transition-colors';
            checkBtn.textContent = 'Verificar Ordem';
            checkBtn.onclick = () => {
                const currentOrder = items.map(i => i.id);
                const isCorrect = JSON.stringify(currentOrder) === JSON.stringify(q.ordemCorreta);
                if(!isCorrect) checkBtn.classList.add('animate-shake');
                checkBtn.disabled = true;
                handleAnswer(isCorrect, q.explicacao);
            };
            
            els.area.appendChild(checkBtn);
        }

        function handleAnswer(isCorrect, explanation) {
            els.feedback.classList.remove('hidden');
            
            // Removemos event listeners antigos
            els.nextBtn.onclick = null; 
            
            if (isCorrect) {
                // Pontuação gamificada: 100 pontos de primeira, 50 pontos com dica.
                score += (currentAttempt === 1) ? 100 : 50; 
                els.score.textContent = score;
                els.fIcon.textContent = '🏆';
                els.fTitle.textContent = 'Exato!';
                els.fTitle.className = 'text-3xl font-extrabold mb-2 text-green-600';
                els.fMsg.textContent = explanation;
                
                // Botão para avançar
                els.nextBtn.textContent = 'Próxima Questão ➔';
                els.nextBtn.className = 'bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-transform transform hover:scale-105 active:scale-95 text-lg mt-4';
                els.nextBtn.onclick = nextQuestion;
            } else {
                els.fIcon.textContent = '❌';
                els.fTitle.textContent = 'Quase lá...';
                els.fTitle.className = 'text-3xl font-extrabold mb-2 text-red-500';
                els.fMsg.textContent = 'Não desanime! Leia a dica do professor e tente novamente para garantir os pontos.';
                
                // Botão para tentar de novo
                els.nextBtn.textContent = 'Ler Dica e Tentar Novamente ↻';
                els.nextBtn.className = 'bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-transform transform hover:scale-105 active:scale-95 text-lg mt-4';
                els.nextBtn.onclick = retryQuestion;
            }
        }

        function nextQuestion() {
            currentLevel++;
            currentAttempt = 1; // Reseta as tentativas para a próxima questão
            renderQuestion();
        }

        function retryQuestion() {
            currentAttempt++; // Aumenta o número de tentativas
            renderQuestion(); // Recarrega a fase, revelando o quadro de dicas
        }

        function showEndScreen() {
            els.progress.style.width = '100%';
            els.area.innerHTML = '';
            els.question.textContent = 'Desafio Concluído! 🎓';
            
            const maxScore = questoes.length * 100;
            const percentage = Math.round((score / maxScore) * 100);
            
            let message = '';
            let emoji = '';
            if (percentage >= 90) { message = 'Você está mais do que preparado para o vestibular!'; emoji = '🏅'; }
            else if (percentage >= 70) { message = 'Ótimo trabalho! Você dominou a maior parte dos conceitos.'; emoji = '👍'; }
            else { message = 'Bom esforço! Recomendamos revisar os temas e tentar novamente para fixar os conceitos.'; emoji = '📚'; }

            const endHTML = `
                <div class="text-center animate-pop mt-4">
                    <div class="text-6xl mb-6">${emoji}</div>
                    <h3 class="text-3xl font-bold text-slate-800 mb-2">Sua Pontuação Final</h3>
                    <div class="text-5xl font-extrabold text-blue-600 mb-6">${score} <span class="text-xl text-slate-500">/ ${maxScore} pts</span></div>
                    <div class="w-full bg-slate-200 h-4 rounded-full mb-6 max-w-sm mx-auto overflow-hidden">
                        <div class="bg-green-500 h-full" style="width: ${percentage}%"></div>
                    </div>
                    <p class="text-lg text-slate-600 mb-8 max-w-md mx-auto">${message}</p>
                    <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-transform transform hover:scale-105">
                        Jogar Novamente ↻
                    </button>
                </div>
            `;
            els.area.innerHTML = endHTML;
        }

        // Inicia o App
        window.onload = initGame;
    </script>
</body>
</html>
