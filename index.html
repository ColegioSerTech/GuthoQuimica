<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Química - Desafio Vestibular</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            color: #2d3748;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 900px;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid #edf2f7;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #4c51bf;
            background-color: #f7fafc;
            transform: translateX(10px);
        }

        .correct {
            background-color: #c6f6d5 !important;
            border-color: #48bb78 !important;
            color: #22543d !important;
        }

        .wrong {
            background-color: #fed7d7 !important;
            border-color: #f56565 !important;
            color: #742a2a !important;
        }

        .progress-bar {
            height: 10px;
            background-color: #edf2f7;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.4s ease;
        }

        sub { bottom: -0.25em; font-size: 0.75em; }
    </style>
</head>
<body>

    <div class="glass-card p-8 md:p-12">
        <!-- Tela Inicial -->
        <div id="start-screen" class="text-center my-auto">
            <div class="mb-6 inline-block p-4 bg-indigo-100 rounded-full">
                <span class="text-5xl">🔬</span>
            </div>
            <h1 class="text-4xl font-black text-gray-800 mb-4 tracking-tight">Master Química: 2º Ano EM</h1>
            <p class="text-xl text-gray-600 mb-8 max-w-2xl mx-auto">
                Prepare-se para o vestibular! Enfrente 40 questões sobre Ligações Químicas, Geometria, Mol e Concentração de Soluções.
            </p>
            <button onclick="startGame()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-12 rounded-2xl text-xl shadow-lg transition transform hover:-translate-y-1">
                Iniciar Grande Desafio
            </button>
            <div class="mt-10 grid grid-cols-2 gap-4 text-sm text-gray-500 font-medium">
                <div class="p-3 bg-gray-50 rounded-lg">Módulo 1: Ligações & VSEPR</div>
                <div class="p-3 bg-gray-50 rounded-lg">Módulo 2: Mol & Soluções</div>
            </div>
        </div>

        <!-- Tela de Jogo -->
        <div id="game-screen" class="hidden flex-grow flex flex-col">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <p id="question-counter" class="text-xs font-bold text-indigo-500 uppercase tracking-widest mb-1">Questão 1 de 40</p>
                    <h3 id="topic-label" class="text-sm text-gray-400">Tópico: Ligações Químicas</h3>
                </div>
                <div class="text-right">
                    <span id="score-display" class="text-lg font-bold text-gray-800">Acertos: 0</span>
                </div>
            </div>
            
            <div class="progress-bar mb-10">
                <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
            </div>

            <div id="question-container" class="flex-grow">
                <h2 id="question-text" class="text-2xl font-bold text-gray-800 mb-8 leading-relaxed">Carregando...</h2>
                <div id="options-grid" class="grid grid-cols-1 gap-4 mb-8">
                    <!-- Opções -->
                </div>
            </div>

            <div id="feedback" class="mt-auto p-6 rounded-2xl hidden">
                <div class="flex items-start gap-4">
                    <div id="feedback-icon" class="text-2xl"></div>
                    <div>
                        <p id="feedback-text" class="text-gray-700 leading-snug"></p>
                        <button id="next-btn" onclick="nextQuestion()" class="mt-4 bg-indigo-600 text-white px-8 py-2 rounded-xl font-bold hover:bg-indigo-700 transition">
                            Próxima Questão →
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tela Final -->
        <div id="end-screen" class="hidden text-center my-auto">
            <h2 class="text-5xl font-black text-gray-800 mb-6">Resultado Final</h2>
            <div class="relative inline-block mb-8">
                <svg class="w-48 h-48">
                    <circle cx="96" cy="96" r="88" stroke="#edf2f7" stroke-width="16" fill="none" />
                    <circle id="final-circle" cx="96" cy="96" r="88" stroke="#4c51bf" stroke-width="16" fill="none" stroke-dasharray="552.92" stroke-dashoffset="552.92" transform="rotate(-90 96 96)" style="transition: stroke-dashoffset 2s ease-out" />
                </svg>
                <div id="final-score" class="absolute inset-0 flex items-center justify-center text-4xl font-black text-indigo-600">0%</div>
            </div>
            <p id="performance-msg" class="text-xl text-gray-600 mb-10 px-10"></p>
            <button onclick="location.reload()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-12 rounded-2xl transition shadow-xl">
                Tentar Novamente
            </button>
        </div>
    </div>

    <script>
        const questions = [
            // --- LIGAÇÕES E GEOMETRIA (1-20) ---
            { q: "Qual é a principal motivação para os átomos realizarem ligações químicas segundo a Regra do Octeto?", options: ["Aumentar sua massa atômica", "Alcançar estabilidade eletrônica semelhante aos gases nobres", "Reduzir o número de prótons", "Ganhar energia cinética"], correct: 1, explain: "A maioria dos átomos busca ter 8 elétrons na camada de valência para atingir a configuração estável de um gás nobre.", topic: "Regra do Octeto" },
            { q: "A ligação iônica ocorre tipicamente entre quais tipos de elementos?", options: ["Metal e Metal", "Não-metal e Não-metal", "Metal e Não-metal", "Gás Nobre e Metal"], correct: 2, explain: "Metais perdem elétrons (cátions) e ametais ganham (ânions), gerando atração eletrostática.", topic: "Ligação Iônica" },
            { q: "Qual é a geometria molecular da água (H<sub>2</sub>O)?", options: ["Linear", "Angular", "Trigonal Plana", "Tetraédrica"], correct: 1, explain: "Os pares de elétrons não ligantes do Oxigênio repelem os pares ligantes, curvando a molécula.", topic: "VSEPR" },
            { q: "Na ligação covalente, os elétrons são:", options: ["Transferidos permanentemente", "Perdidos para o meio", "Compartilhados entre os átomos", "Aniquilados"], correct: 2, explain: "Covalência é o compartilhamento de pares eletrônicos para estabilidade mútua.", topic: "Ligação Covalente" },
            { q: "Qual dessas moléculas possui geometria tetraédrica?", options: ["CO<sub>2</sub>", "CH<sub>4</sub> (Metano)", "NH<sub>3</sub>", "BF<sub>3</sub>"], correct: 1, explain: "O Carbono faz 4 ligações simples simétricas, resultando em um tetraedro.", topic: "Geometria Molecular" },
            { q: "O elemento Sódio (Z=11) ao formar uma ligação iônica tende a:", options: ["Ganhar 1 elétron", "Perder 1 elétron", "Compartilhar 2 elétrons", "Perder 7 elétrons"], correct: 1, explain: "O Na perde o único elétron da camada M para ficar com 8 na camada L.", topic: "Eletrosfera" },
            { q: "Por que a molécula de NH<sub>3</sub> é piramidal e não trigonal plana?", options: ["Devido ao par de elétrons isolado no Nitrogênio", "Porque o Hidrogênio é muito pesado", "Porque o Nitrogênio é um metal", "Ela é trigonal plana"], correct: 0, explain: "O par isolado exerce repulsão e 'empurra' os Hidrogênios para baixo.", topic: "VSEPR" },
            { q: "O que caracteriza uma ligação covalente polar?", options: ["Elétrons compartilhados igualmente", "Átomo mais eletronegativo atrai mais o par eletrônico", "Ocorre apenas entre metais", "Resulta sempre em molécula linear"], correct: 1, explain: "A diferença de eletronegatividade cria um dipolo elétrico na ligação.", topic: "Polaridade" },
            { q: "Qual a geometria da molécula de Dióxido de Carbono (CO<sub>2</sub>)?", options: ["Angular", "Linear", "Piramidal", "Tetraédrica"], correct: 1, explain: "Sem elétrons isolados no Carbono, as duplas ligações ficam a 180°.", topic: "Geometria Molecular" },
            { q: "Qual destas substâncias possui ligação iônica?", options: ["H<sub>2</sub>O", "HCl", "NaCl", "O<sub>2</sub>"], correct: 2, explain: "Metal (Na) + Ametal (Cl) = Composto Iônico clássico.", topic: "Ligações Químicas" },
            { q: "Quantos elétrons o Cloro (Z=17) precisa para completar seu octeto?", options: ["1", "2", "7", "8"], correct: 0, explain: "Possui 7 na valência, falta apenas 1 elétron.", topic: "Regra do Octeto" },
            { q: "O que diz a Regra do Dueto?", options: ["Átomos querem 2 prótons", "Elementos leves (H, Li, He) estabilizam-se com 2 elétrons", "Ligações só em pares", "Átomos dobram de tamanho"], correct: 1, explain: "Átomos próximos ao Hélio buscam ter apenas 2 elétrons.", topic: "Regra do Octeto" },
            { q: "Qual a geometria do BF<sub>3</sub> (Exceção ao Octeto)?", options: ["Trigonal Plana", "Tetraédrica", "Linear", "Piramidal"], correct: 0, explain: "O Boro estabiliza com 6 elétrons, formando ângulos de 120°.", topic: "VSEPR" },
            { q: "Ligações metálicas são descritas pelo modelo do:", options: ["Compartilhamento fixo", "Mar de elétrons", "Transferência de prótons", "Vácuo atômico"], correct: 1, explain: "Elétrons livres circulam entre cátions metálicos, garantindo condutividade.", topic: "Ligação Metálica" },
            { q: "O composto MgCl<sub>2</sub> apresenta que tipo de ligação?", options: ["Covalente", "Iônica", "Metálica", "De Hidrogênio"], correct: 1, explain: "Transferência de elétrons do Magnésio para o Cloro.", topic: "Ligações Químicas" },
            { q: "Uma ligação tripla envolve o compartilhamento de quantos elétrons no total?", options: ["3", "4", "6", "8"], correct: 2, explain: "3 ligações = 3 pares = 6 elétrons.", topic: "Ligação Covalente" },
            { q: "A molécula de Metano (CH<sub>4</sub>) é polar ou apolar?", options: ["Polar", "Apolar", "Iônica", "Metálica"], correct: 1, explain: "A simetria tetraédrica anula os vetores de polaridade.", topic: "Polaridade" },
            { q: "Ângulo aproximado em uma geometria tetraédrica perfeita?", options: ["90°", "120°", "109,5°", "180°"], correct: 2, explain: "Ângulo máximo de afastamento para 4 nuvens eletrônicas.", topic: "VSEPR" },
            { q: "O Ozônio (O<sub>3</sub>) possui geometria:", options: ["Linear", "Angular", "Trigonal Plana", "Piramidal"], correct: 1, explain: "A nuvem eletrônica não ligante no oxigênio central distorce a forma para angular.", topic: "Geometria Molecular" },
            { q: "Cátions são formados quando um átomo:", options: ["Ganha elétrons", "Perde elétrons", "Ganha nêutrons", "Perde prótons"], correct: 1, explain: "Perder carga negativa (elétrons) torna o átomo positivo.", topic: "Íons" },

            // --- MOL, MASSA MOLAR E SOLUÇÕES (21-40) ---
            { q: "O que representa a Constante de Avogadro (6,02 x 10<sup>23</sup>)?", options: ["A massa de um próton", "O número de partículas em 1 mol de qualquer substância", "A velocidade da luz no vácuo", "O número de elétrons no Oxigênio"], correct: 1, explain: "É a unidade de contagem da química, definindo o número de entidades em 1 mol.", topic: "Quantidade de Matéria" },
            { q: "Qual a massa molar da Água (H<sub>2</sub>O)? (Dados: H=1, O=16)", options: ["17 g/mol", "18 g/mol", "10 g/mol", "32 g/mol"], correct: 1, explain: "(2x1) + 16 = 18 g/mol.", topic: "Massa Molar" },
            { q: "Quantos mols existem em 88g de CO<sub>2</sub>? (Massa Molar do CO<sub>2</sub> = 44 g/mol)", options: ["1 mol", "2 mols", "0,5 mol", "4 mols"], correct: 1, explain: "n = m / MM -> 88 / 44 = 2 mols.", topic: "Quantidade de Matéria" },
            { q: "Uma solução que contém a quantidade máxima de soluto que o solvente consegue dissolver a uma dada temperatura é chamada de:", options: ["Diluída", "Saturada", "Insuperável", "Concentrada"], correct: 1, explain: "Saturada atingiu o limite do coeficiente de solubilidade.", topic: "Soluções" },
            { q: "Calcule a concentração comum (C) de uma solução com 20g de sal em 500mL de água.", options: ["10 g/L", "40 g/L", "20 g/L", "100 g/L"], correct: 1, explain: "C = m/V(L) -> 20g / 0,5L = 40 g/L.", topic: "Concentração Comum" },
            { q: "O que acontece com a concentração de uma solução quando adicionamos apenas solvente?", options: ["Aumenta (Fica mais concentrada)", "Diminui (Ocorre diluição)", "Permanece igual", "O soluto desaparece"], correct: 1, explain: "Adicionar solvente aumenta o volume sem aumentar o soluto, diluindo a mistura.", topic: "Diluição" },
            { q: "Qual a massa de 3 mols de Gás Oxigênio (O<sub>2</sub>)? (O=16)", options: ["32g", "48g", "96g", "16g"], correct: 2, explain: "O2 = 32 g/mol. 3 x 32 = 96g.", topic: "Massa Molar" },
            { q: "Molaridade ou Concentração Molar (M) é expressa em que unidade?", options: ["g/L", "mol/L", "kg/mL", "mols/g"], correct: 1, explain: "Indica quantos mols de soluto existem por litro de solução.", topic: "Molaridade" },
            { q: "Se eu tenho 1 mol de Glicose (C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>), quantas moléculas eu tenho?", options: ["180 moléculas", "6,02 x 10<sup>23</sup> moléculas", "12 moléculas", "1,2 x 10<sup>24</sup> moléculas"], correct: 1, explain: "1 mol sempre contém o número de Avogadro de partículas.", topic: "Quantidade de Matéria" },
            { q: "Uma solução 'soro fisiológico' tem 0,9% de NaCl em massa. Isso significa que:", options: ["Há 0,9g de NaCl em 100g de solução", "Há 9g em 1L", "A solução é pura", "Há 0,9 mols em 1L"], correct: 0, explain: "Título ou porcentagem em massa indica partes de soluto por 100 partes de solução.", topic: "Concentração" },
            { q: "Qual o volume final de uma solução se eu diluir 100mL de suco concentrado para que o volume triplique?", options: ["100mL", "200mL", "300mL", "400mL"], correct: 2, explain: "Triplicar 100mL resulta em 300mL.", topic: "Diluição" },
            { q: "Massa de NaOH necessária para preparar 1L de solução 0,5 mol/L? (MM do NaOH = 40g/mol)", options: ["40g", "20g", "80g", "10g"], correct: 1, explain: "0,5 mol/L em 1L = 0,5 mol. m = 0,5 * 40 = 20g.", topic: "Cálculo de Soluções" },
            { q: "O ar atmosférico é um exemplo de:", options: ["Solução gasosa", "Substância pura", "Composto iônico", "Solução sólida"], correct: 0, explain: "Mistura homogênea de gases (Nitrogênio, Oxigênio, etc).", topic: "Soluções" },
            { q: "Densidade de uma solução é a relação entre:", options: ["Massa do soluto e Volume da solução", "Massa da solução e Volume da solução", "Massa do soluto e Massa do solvente", "Volume e Temperatura"], correct: 1, explain: "Densidade engloba a massa total (soluto + solvente).", topic: "Propriedades" },
            { q: "Quantos átomos de Ferro existem em 1 mol de Ferro?", options: ["26 átomos", "56 átomos", "6,02 x 10<sup>23</sup> átomos", "1 átomo"], correct: 2, explain: "1 mol de elemento = 6,02 x 10^23 átomos.", topic: "Quantidade de Matéria" },
            { q: "Se a concentração de um poluente é 1 ppm (parte por milhão), isso equivale a:", options: ["1g por Litro", "1mg por Litro (em água)", "1kg por metro", "1% da massa"], correct: 1, explain: "1mg/L em água é aproximadamente 1 parte em 1.000.000 de partes.", topic: "Unidades de Concentração" },
            { q: "A massa molar do Ácido Sulfúrico (H<sub>2</sub>SO<sub>4</sub>) é 98 g/mol. Qual a massa de 0,1 mol?", options: ["980g", "9,8g", "0,98g", "49g"], correct: 1, explain: "0,1 * 98 = 9,8g.", topic: "Cálculo Estequiométrico" },
            { q: "Ao preparar um refresco em pó, o pó é o ____ e a água é o ____.", options: ["Solvente / Soluto", "Soluto / Solvente", "Mistura / Reagente", "Cátion / Ânion"], correct: 1, explain: "Soluto é o que se dissolve, solvente é o que dissolve.", topic: "Soluções" },
            { q: "Qual a molaridade de uma solução com 2 mols de soluto em 4 litros de solução?", options: ["8 mol/L", "2 mol/L", "0,5 mol/L", "4 mol/L"], correct: 2, explain: "M = n/V -> 2/4 = 0,5 mol/L.", topic: "Molaridade" },
            { q: "O volume molar de qualquer gás nas CNTP é aproximadamente:", options: ["22,4 L", "10,0 L", "2,0 L", "100 L"], correct: 0, explain: "Nas CNTP (0°C, 1 atm), 1 mol de gás ocupa 22,4 litros.", topic: "Gases" }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        const questionText = document.getElementById('question-text');
        const optionsGrid = document.getElementById('options-grid');
        const feedback = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackIcon = document.getElementById('feedback-icon');
        const counterText = document.getElementById('question-counter');
        const topicLabel = document.getElementById('topic-label');
        const scoreText = document.getElementById('score-display');
        const progressFill = document.getElementById('progress-fill');

        function startGame() {
            startScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            answered = false;
            feedback.classList.add('hidden');
            optionsGrid.innerHTML = '';
            
            const q = questions[currentQuestion];
            questionText.innerHTML = q.q;
            topicLabel.innerText = `Tópico: ${q.topic}`;
            counterText.innerText = `Questão ${currentQuestion + 1} de ${questions.length}`;
            
            const prog = (currentQuestion / questions.length) * 100;
            progressFill.style.width = `${prog}%`;

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-5 rounded-2xl font-semibold text-gray-700 bg-white shadow-sm";
                btn.innerHTML = opt;
                btn.onclick = () => checkAnswer(index);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(index) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const buttons = optionsGrid.getElementsByTagName('button');

            if (index === q.correct) {
                buttons[index].classList.add('correct');
                score++;
                scoreText.innerText = `Acertos: ${score}`;
                feedbackIcon.innerText = "⭐";
                feedbackText.innerHTML = `<strong class="text-green-700">Resposta Correta!</strong><br>${q.explain}`;
                feedback.className = "mt-auto p-6 rounded-2xl bg-green-50 border-2 border-green-200 block animate-pulse";
            } else {
                buttons[index].classList.add('wrong');
                buttons[q.correct].classList.add('correct');
                feedbackIcon.innerText = "💡";
                feedbackText.innerHTML = `<strong class="text-red-700">Não foi dessa vez...</strong><br>${q.explain}`;
                feedback.className = "mt-auto p-6 rounded-2xl bg-red-50 border-2 border-red-200 block";
            }

            for (let b of buttons) b.disabled = true;
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showEndScreen();
            }
        }

        function showEndScreen() {
            gameScreen.classList.add('hidden');
            endScreen.classList.remove('hidden');
            
            const percentage = Math.round((score / questions.length) * 100);
            const finalScoreElem = document.getElementById('final-score');
            const finalCircle = document.getElementById('final-circle');
            
            finalScoreElem.innerText = `${percentage}%`;
            
            // Animação do círculo de progresso
            const offset = 552.92 - (552.92 * percentage) / 100;
            setTimeout(() => {
                finalCircle.style.strokeDashoffset = offset;
            }, 100);

            const msg = document.getElementById('performance-msg');
            if (percentage === 100) msg.innerText = "Perfeito! Você dominou todos os conceitos. Nível Medicina/ITA! 🏆";
            else if (percentage >= 80) msg.innerText = "Excelente desempenho! Você está muito bem preparado para os vestibulares. 🚀";
            else if (percentage >= 60) msg.innerText = "Bom resultado! Você entende os conceitos básicos, mas revise os cálculos de concentração. 📊";
            else if (percentage >= 40) msg.innerText = "Você está no caminho, mas precisa praticar mais exercícios de estequiometria e mol. 🧪";
            else msg.innerText = "Não desanime! Química é uma matéria cumulativa. Revise a base de átomos e mols e tente novamente. 📚";
        }
    </script>
</body>
</html>
